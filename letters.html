<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="The complete Letters archive from Bhavya's Day."><title>Letters · Bhavya's Day</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;600&display=swap');
:root{--cream:#fffaf2;--blush:#f9dfe0;--pink:#df9ba0;--ink:#625c60;--muted:#8d8283;--line:rgba(98,89,83,.12)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1100px,calc(100% - 44px));margin:auto}.top{padding:25px 0;display:flex;justify-content:space-between;align-items:center}.logo{font-family:'Fraunces';font-size:1.35rem;font-weight:600}.logo em{font-style:italic;color:var(--pink)}.back{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid rgba(98,89,83,.3);padding:10px 15px;border-radius:999px}.back:hover{background:var(--blush)}.intro{padding:90px 0 65px;max-width:900px}.kicker{text-transform:uppercase;letter-spacing:.13em;font-size:.68rem;font-weight:700;color:#c7867d}h1{font-family:'Fraunces';font-size:clamp(4rem,9vw,8rem);font-weight:500;line-height:.9;letter-spacing:-.05em;margin:18px 0 25px;color:#685d57}h1 em{font-style:italic;color:#c58d83}.intro p{max-width:620px;font-size:1rem;line-height:1.75;color:var(--muted);margin:0}.archive{border-top:1px solid var(--line);padding-bottom:90px}.letter{display:grid;grid-template-columns:125px 1fr 110px;gap:28px;align-items:center;padding:34px 0;border-bottom:1px solid var(--line);transition:.25s}.letter:hover{padding-left:14px;padding-right:14px;background:rgba(255,255,255,.4)}.date{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.title{font-family:'Fraunces';font-size:clamp(1.8rem,3.5vw,3.1rem);font-weight:500;line-height:1;color:#685d57}.desc{font-size:.82rem;line-height:1.6;color:var(--muted);margin-top:10px;max-width:700px}.read{justify-self:end;font-size:.69rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#bd8179}.read:hover{color:#a96f67}footer{border-top:1px solid var(--line);padding:28px 0 40px;font-size:.72rem;color:var(--muted)}@media(max-width:700px){.wrap{width:min(100% - 30px,1100px)}.top{padding:18px 0}.intro{padding:65px 0 45px}.letter{grid-template-columns:1fr;gap:9px;padding:28px 0}.read{justify-self:start;margin-top:8px}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">Bhavya<span>'s Day</span><em>.</em></a><a class="back" href="index.html#letters">back to home</a></header><main><section class="intro"><div class="kicker">the complete archive</div><h1>All my<br><em>letters.</em></h1><p>The full collection of notes from Bhavya's Day, kept in one place. The homepage carries the latest three. This is where you can wander through everything.</p></section><section id="letters-archive-dynamic" class="archive"></section></main><footer>© 2026 Bhavya's Day · all letters, in one little corner.</footer></div><script>
const LETTERS_SOURCE='https://api.github.com/repos/BhavyasDay/bhavyasday-website/contents/blogs?ref=main';
const LETTERS_FALLBACK=[
 {file:'fifthblog.html',date:'4 October 2026',title:'I Am the Woman My Bloodline Had No Language For.',desc:'A reflection on inherited expectations, expansion, abundance, and becoming the life your roots may never have had language for.'},
 {file:'fourthblog.html',date:'3 October 2026',title:'Why Everyone Needs an Entrepreneurial Mindset.',desc:'Why entrepreneurship is less about a job title and more about agency, systems thinking, spotting friction and creating durable value.'},
 {file:'thirdblog.html',date:'2 October 2026',title:'Beyond the Prompt Box: How to Build an AI Productivity Stack That Actually Works.',desc:'A practical look at turning AI from a standalone chatbot into a lean workflow for research, thinking, communication, execution and automation.'},
 {file:'secondblog.html',date:'1 October 2026',title:'Things I Am Learning Lately: On Numbers, Noise, and Room to Breathe.',desc:'Finance, routines, quiet ideas, meaningful work and the small turns that are teaching me how to make more room for the life I am building.'},
 {file:'firstblog.html',date:'30 September 2026',title:'A little corner of the internet, finally.',desc:'The first note from Bhavya\'s Day.'}
];
function cleanTitle(doc){const h=doc.querySelector('.article-head h1');return h?h.textContent.trim():doc.title.replace(/\s*[·|].*$/,'').trim()}
function cleanDate(doc){const d=doc.querySelector('.article-head .date');return d?d.textContent.replace(/\s*·\s*Bhavya.?s Day/i,'').trim():''}
function cleanDesc(doc){const m=doc.querySelector('meta[name="description"]');if(!m)return '';let x=m.content||'';return x.replace(/\s*A daily note from Bhavya.?s Day\.?$/i,'').trim()}
function parseDate(x){const t=Date.parse(x);return Number.isNaN(t)?0:t}
async function getLetters(){
 try{
  const listing=await fetch(LETTERS_SOURCE,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error('listing failed');return r.json()});
  const files=listing.filter(x=>x.type==='file'&&/^\d+blog\.html$/.test(x.name));
  const items=await Promise.all(files.map(async x=>{
   const html=await fetch(x.download_url).then(r=>r.text());
   const doc=new DOMParser().parseFromString(html,'text/html');
   const known=LETTERS_FALLBACK.find(k=>k.file===x.name); return known || {file:x.name,date:cleanDate(doc),title:cleanTitle(doc),desc:cleanDesc(doc)};
  }));
  return items.filter(x=>x.date&&x.title).sort((a,b)=>parseDate(b.date)-parseDate(a.date));
 }catch(e){return LETTERS_FALLBACK}
}
function letterCard(x,archive=false){
 const href=`blogs/${x.file}`;
 if(archive)return `<article class="letter"><div class="date">${x.date}</div><div><a class="title" href="${href}">${x.title}</a><div class="desc">${x.desc||''}</div></div><a class="read" href="${href}">read ↗</a></article>`;
 return `<article class="letter reveal"><div class="letter-date">${x.date}</div><div><h3>${x.title}</h3><p>${x.desc||''}</p></div><a class="read" href="${href}">read ↗</a></article>`;
}
async function renderLetters(){
 const items=await getLetters();
 const home=document.getElementById('letter-list-dynamic');
 if(home)home.innerHTML=items.slice(0,3).map(x=>letterCard(x)).join('');
 const archive=document.getElementById('letters-archive-dynamic');
 if(archive)archive.innerHTML=items.map(x=>letterCard(x,true)).join('');
 if(window.IntersectionObserver){document.querySelectorAll('.reveal').forEach(x=>observer.observe(x));}
}
renderLetters();
</script>
</body></html>
